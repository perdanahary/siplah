<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </linearGradient>
    <filter id="bookShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="12" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>

  <!-- Book Wrapper with shadow -->
  <g transform="translate(130, 45)" filter="url(#bookShadow)">
    
    <!-- Book Pages Edge (Thickness 3D) -->
    <path d="M 330,22 L 350,15 L 350,485 L 330,500 Z" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Page lines -->
    <line x1="335" y1="20" x2="335" y2="495" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="340" y1="18" x2="340" y2="490" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="345" y1="16" x2="345" y2="487" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Front Cover -->
    <rect x="0" y="20" width="330" height="480" rx="8" fill="url(#coverGrad)"/>

    <!-- Spine Shading -->
    <rect x="0" y="20" width="32" height="480" fill="url(#spineGrad)"/>
    <line x1="32" y1="20" x2="32" y2="500" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1"/>

    <!-- Gold Accent Borders -->
    <rect x="18" y="38" width="294" height="444" rx="4" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="8, 4"/>
    <rect x="24" y="44" width="282" height="432" rx="3" fill="none" stroke="#60a5fa" stroke-width="0.75" stroke-opacity="0.4"/>

    <!-- Header / Kemdikdasmen BANPEM Banner -->
    <rect x="36" y="58" width="258" height="34" rx="4" fill="#047857"/>
    <text x="165" y="74" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" letter-spacing="1.5" text-anchor="middle">KEMDIKDASMEN REPUBLIK INDONESIA</text>
    <text x="165" y="86" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="900" letter-spacing="2" text-anchor="middle">PROGRAM BANPEM 2026</text>

    <!-- Book Icon Graphic -->
    <g transform="translate(165, 155)">
      <!-- Circle backdrop -->
      <circle cx="0" cy="0" r="42" fill="#1e40af" stroke="#60a5fa" stroke-width="2"/>
      <!-- Open book / quill icon -->
      <path d="M -24,-12 C -14,-16 -4,-14 0,-8 C 4,-14 14,-16 24,-12 L 24,18 C 14,14 4,16 0,22 C -4,16 -14,14 -24,18 Z" fill="#ffffff" opacity="0.95"/>
      <path d="M 0,-8 L 0,22" stroke="#1e3a8a" stroke-width="2"/>
      <!-- Pen Quill -->
      <path d="M 6,-18 L 18,-30 C 21,-33 25,-30 22,-27 L 10,-15 Z" fill="url(#goldGrad)"/>
    </g>

    <!-- Main Title -->
    <text x="165" y="235" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="0.5" text-anchor="middle">BUKU PANDUAN</text>
    <text x="165" y="265" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="1" text-anchor="middle">MENULIS</text>

    <!-- Subtitle -->
    <text x="165" y="292" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" text-anchor="middle">Penguatan Literasi &amp; Penulisan Kreatif</text>
    <text x="165" y="308" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" text-anchor="middle">Satuan Pendidikan Dasar dan Menengah</text>

    <!-- Divider line -->
    <line x1="60" y1="324" x2="270" y2="324" stroke="url(#goldGrad)" stroke-width="2"/>

    <!-- Category Badge -->
    <g transform="translate(65, 342)">
      <rect width="200" height="42" rx="6" fill="#ffffff" fill-opacity="0.08" stroke="#38bdf8" stroke-width="1"/>
      <text x="100" y="18" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" letter-spacing="1" text-anchor="middle">★ KATEGORI BANPEM 2026 ★</text>
      <text x="100" y="32" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Terverifikasi Resmi SI ASPRI</text>
    </g>

    <!-- Publisher Section -->
    <text x="165" y="445" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" letter-spacing="1" text-anchor="middle">PENERBIT RESMI MITRA SIPLAH</text>
    <text x="165" y="462" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PENERBIT PUSTAKA MENULIS SD</text>

    <!-- Ribbon / Corner Bookmark -->
    <path d="M 280,20 L 310,20 L 310,65 L 295,52 L 280,65 Z" fill="url(#goldGrad)"/>
    <text x="295" y="38" fill="#78350f" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="900" text-anchor="middle">2026</text>
  </g>
</svg>
